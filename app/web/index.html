<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>输出优化台 · Post-hoc 二次优化</title>
    <script>
      /* 首帧前定主题：classic 脚本阻塞解析，一定早于首次绘制，避免浅深切换闪屏。
         本文件不得出现任何站外地址，命名空间声明也一律省略（内联 SVG 在 HTML 中非必需）。 */
      (function () {
        var stored = null;
        try {
          stored = window.localStorage.getItem("optimize-theme");
        } catch (error) {
          stored = null;
        }
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = stored || (prefersDark ? "dark" : "light");
      })();
    </script>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <aside class="rail" id="history-rail" aria-label="历史会话">
        <div class="rail-top">
          <span class="mark"></span>
          <span class="rail-title">历史会话</span>
          <button type="button" class="icon-btn" id="toggle-history" aria-expanded="true" aria-label="折叠历史列表">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.5 3.5 5 8l4.5 4.5" /></svg>
          </button>
        </div>
        <button type="button" class="new" id="new-run">＋ 新建优化</button>
        <div class="list" id="history-list"></div>
        <div class="rail-foot" id="history-foot"></div>
      </aside>

      <div class="main">
        <div class="head">
          <span class="brand">Post-hoc 输出优化器</span>
          <span class="hint">对 harness 输出做二次优化</span>
          <span class="grow"></span>
          <button type="button" class="ghost" id="theme-toggle" aria-pressed="false">深色</button>
          <span class="dot unknown" id="health-dot" title="健康检查"></span>
        </div>

        <div class="flow">
          <section class="turn" id="result-panel" hidden aria-label="优化结果">
            <div class="turn-top"><span id="result-id"></span></div>

            <div class="echo">
              <b>输入</b>
              <span id="echo-input"></span>
            </div>

            <div class="verdict" id="verdict"></div>

            <div class="card">
              <div class="card-top">
                <span>优化前 → 优化后</span>
                <span class="grow"></span>
                <span class="pill" id="diff-mode"></span>
              </div>
              <div class="diff" id="diff"></div>
            </div>

            <details class="dets" id="details-region">
              <summary>详情 · 步骤 / 评分 / 变更 / 环境</summary>
              <div class="dgrid">
                <div>
                  <div class="cap">步骤时间线</div>
                  <div class="steps" id="steps"></div>
                  <div class="cap">评分维度</div>
                  <div class="dimensions" id="dimensions"></div>
                </div>
                <div>
                  <div class="cap">运行指标</div>
                  <div class="tags" id="meta-chips"></div>
                  <div class="cap">变更与标记</div>
                  <div class="tags" id="tags"></div>
                  <div class="cap">运行环境</div>
                  <dl class="env" id="env"></dl>
                  <div class="errors" id="errors"></div>
                </div>
              </div>
            </details>
          </section>

          <form class="composer" id="optimize-form" data-mode="paste">
            <div class="mode">
              <span class="seg" role="group" aria-label="输入方式">
                <button type="button" class="on" id="mode-paste">粘贴输出</button>
                <button type="button" id="mode-harness">驱动 harness</button>
              </span>
              <span class="hint" id="mode-hint">粘贴 harness 或模型已经产出的原文</span>
            </div>

            <label class="field only-paste">
              <span class="flabel">raw_output · 待二次优化的原文</span>
              <textarea id="field-raw" name="raw_output" rows="4" spellcheck="false" placeholder="把 harness 的输出原样粘贴到这里，支持 Markdown 围栏与客套话前后缀"></textarea>
            </label>

            <label class="field only-harness">
              <span class="flabel">task · 交给 harness 的任务（经 stdin 传入；命令与参数只来自服务端配置）</span>
              <textarea id="field-task" rows="3" spellcheck="false" placeholder="例如：总结这篇论文的方法与结论"></textarea>
            </label>

            <input class="instr" id="field-instruction" name="instruction" type="text" placeholder="任务说明，例如：抽取论文元数据，参考文献按 GB/T 7714 规范" />

            <div class="foot">
              <select id="field-schema" name="schema" aria-label="Schema"></select>

              <details class="params" id="params">
                <summary>参数</summary>
                <div class="pbody">
                  <label class="field">
                    <span class="flabel">input_text · 原始材料（事实溯源依据，留空则不计一致性分）</span>
                    <textarea id="field-input-text" name="input_text" rows="3" spellcheck="false"></textarea>
                  </label>

                  <div class="cap">管线开关</div>
                  <div class="options" id="options" role="group" aria-label="步骤开关"></div>

                  <div class="cap">harness</div>
                  <div class="hrow">
                    <select id="field-harness" aria-label="harness profile"></select>
                    <button type="button" class="ghost" id="harness-detect-btn">带探测重新检测</button>
                  </div>
                  <div class="detected" id="harness-detected"></div>
                  <div class="prov-note" id="harness-notes"></div>
                  <div class="status" id="harness-status"></div>
                </div>
              </details>

              <button type="submit" class="primary" id="run-btn">运行优化</button>
              <span class="status" id="form-status"></span>
            </div>
          </form>
        </div>
      </div>
    </div>

    <template id="tpl-history-item">
      <button type="button" class="history-item">
        <span class="i1">
          <span class="dot" data-role="dot"></span>
          <span class="kind" data-role="schema"></span>
          <span class="score" data-role="score"></span>
        </span>
        <span class="prev" data-role="preview"></span>
        <span class="meta" data-role="meta"></span>
      </button>
    </template>

    <script src="/static/app.js"></script>
  </body>
</html>
