steps:
  - name: schema
    enabled: true
    strict: false          # false 时剔除多余字段而非直接判失败

  - name: rules
    enabled: true
    weights:                # 散文与结构化各用一组权重，缺省见 app/settings.py
      prose:
        plainness: 0.5
        concision: 0.3
        preservation: 0.2
      structured:
        completeness: 0.3
        format: 0.25
        grounding: 0.25
        plainness: 0.2

  - name: repair
    enabled: true
    prompt: prompts/repair.txt

  - name: format
    enabled: true
    strip_markdown_fences: true
    trim_whitespace: true
    reference_style: gb-t-7714   # 可选 apa

  - name: simplify
    enabled: true          # 散文输出默认通俗化；结构化字段仍默认关，见 pipeline 内 prose_only
    prose_only: true
    prompt: prompts/simplify.txt

fail_open: true
audit: true
