name: CI

on:
  push:
    branches-ignore: ['dependabot/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 1 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PROVIDER: mock
  OPENAI_API_KEY: ''
  PYTHONUTF8: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  repository:
    name: Repository and workflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.source.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Detect application source
        id: source
        shell: bash
        run: |
          if [[ -z "$(git ls-files -- 'app/*.py')" ]]; then
            echo 'code=false' >> "$GITHUB_OUTPUT"
            echo '### Waiting for application source' >> "$GITHUB_STEP_SUMMARY"
            echo 'Python application checks are skipped until app/ is committed. This is not a passing application test result.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'code=true' >> "$GITHUB_OUTPUT"
            for path in requirements.txt app/main.py tests scripts/demo.py scripts/evaluate.py data/golden.jsonl; do
              if [[ ! -e "$path" ]]; then
                echo "::error::Application source is incomplete: missing $path"
                exit 1
              fi
            done
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python -m pip install -r .github/requirements-ci.txt
      - name: YAML syntax and style
        run: python -m yamllint -c .github/yamllint.yml .github
      - name: GitHub Actions expressions and shell commands
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: CI helper lint and formatting
        run: |
          python -m ruff check --config .github/ruff.toml .github/scripts
          python -m ruff format --check --config .github/ruff.toml .github/scripts

  lint:
    name: Python lint and formatting
    needs: repository
    if: needs.repository.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python -m pip install -r .github/requirements-ci.txt
      - run: python -m ruff check --config .github/ruff.toml app scripts tests
      - run: python -m ruff format --check --config .github/ruff.toml app scripts tests

  types:
    name: Python type checks
    needs: repository
    if: needs.repository.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/requirements-ci.txt
      - run: python -m pip install -r requirements.txt -r .github/requirements-ci.txt
      - run: python -m mypy --config-file .github/mypy.ini app

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: repository
    if: needs.repository.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: Tests with coverage gate
        run: >-
          python -m pytest -q --cov=app --cov-branch --cov-fail-under=80
          --cov-report=term-missing --cov-report=xml:artifacts/coverage.xml
          --cov-report=json:artifacts/coverage.json
          --junitxml=artifacts/junit.xml
      - name: README metrics guard
        if: matrix.os == 'windows-latest'
        run: >-
          python .github/scripts/check_readme_metrics.py
          --junit artifacts/junit.xml --coverage artifacts/coverage.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: tests-${{ matrix.os }}-py${{ matrix.python }}
          path: artifacts/
          retention-days: 14

  smoke:
    name: Offline demo and golden regression
    needs: repository
    if: needs.repository.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUDIT_PATH: artifacts/audit.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/demo.py
      - run: >-
          python scripts/evaluate.py --dataset data/golden.jsonl --provider mock
          --out artifacts/evaluation.md --audit artifacts/evaluation-audit.jsonl
      - run: python .github/scripts/check_evaluation.py artifacts/evaluation.csv
      # README §9 的实测表与这一次评估同源比对：数字只能来自真实运行，不能靠人抄
      - run: python .github/scripts/check_readme_metrics.py --evaluation artifacts/evaluation.metrics.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: offline-evaluation
          path: artifacts/
          retention-days: 14

  bandit:
    name: Python security scan
    needs: repository
    if: needs.repository.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python -m pip install -r .github/requirements-ci.txt
      - run: python -m bandit -r app -f json -o bandit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: bandit
          path: bandit.json
          retention-days: 14

  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python -m pip install -r .github/requirements-ci.txt
      - name: Audit CI dependencies
        run: python -m pip_audit -r .github/requirements-ci.txt --format json --output ci-dependencies.json
      - name: Audit application dependencies
        if: ${{ !cancelled() && hashFiles('requirements.txt') != '' }}
        run: python -m pip_audit -r requirements.txt --format json --output app-dependencies.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: dependency-audit
          path: '*-dependencies.json'
          retention-days: 14

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  codeql:
    name: CodeQL
    needs: repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: ${{ needs.repository.outputs.code == 'true' && 'actions,python' || 'actions' }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3

  result:
    name: CI result
    if: always()
    needs: [repository, lint, types, tests, smoke, bandit, dependencies, secrets, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report required job results
        env:
          JOBS: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json
          import os
          jobs = json.loads(os.environ['JOBS'])
          code = jobs['repository']['outputs'].get('code') == 'true'
          application = {'lint', 'types', 'tests', 'smoke', 'bandit'}
          failures = []
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('| Check | Result |\n| --- | --- |\n')
              for name, job in jobs.items():
                  result = job['result']
                  summary.write(f'| {name} | {result} |\n')
                  allowed_skip = not code and name in application and result == 'skipped'
                  if result != 'success' and not allowed_skip:
                      failures.append(name)
              if not code:
                  summary.write('\nApplication source is not uploaded; application checks have NOT run.\n')
          if failures:
              raise SystemExit('Failed or unexpectedly skipped checks: ' + ', '.join(failures))
